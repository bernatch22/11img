name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Invoked as a gate by release.yml. A tag push does NOT match `push.branches`,
  # so without this the release path would have no gate at all.
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The CLI must at least load and answer offline on every target.
      - run: node dist/cli/main.js models
