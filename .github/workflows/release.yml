name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # The tag IS the publication, and npm versions are permanent. Refuse to
  # publish an artefact whose name disagrees with what the tag claims.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }

  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [guard, gates]
    runs-on: ubuntu-latest
    # Matched by name by the Trusted Publisher configured on npmjs.com.
    environment: npm
    permissions:
      id-token: write # OIDC, for npm Trusted Publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # setup-node ships npm 10.x, which does not know the OIDC registry
      # exchange and falls back to an ANONYMOUS publish (404 on PUT).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        if: github.ref_type == 'tag'
